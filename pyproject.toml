[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-manager"
version = "1.0.0"
description = "Daily AI briefing and inbox cleanup across Gmail, Outlook, and IMAP accounts, powered by Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Okonek" }]
keywords = ["email", "claude", "anthropic", "gmail", "outlook", "imap", "digest", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
]
dependencies = [
  "anthropic>=1,<2",
  "pydantic>=2.7,<3",
  "click>=8.1",
  "rich>=13",
  "pyyaml>=6",
  "python-dotenv>=1",
  "python-dateutil>=2.8",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "google-api-python-client>=2.100",
  "msal>=1.28",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-requests",
  "types-python-dateutil",
]

[project.scripts]
email-manager = "email_manager.cli:cli"

[project.urls]
Repository = "https://github.com/danieljokonek-sys/email-manager-work-sample"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
email_manager = ["prompts/*.md", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["setup_wizard.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "T20"]
ignore = [
  "E501",   # long lines are allowed in prompt text; ruff format handles code
  "RUF012", # mutable class attributes are fine for simple constants here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"main.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["email_manager"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:email_manager.*"]

[tool.coverage.run]
source = ["email_manager"]
branch = true
